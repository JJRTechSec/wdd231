<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- FAVICON -->
    <link rel="icon" href="./images/chamber-logo.svg">
    <!-- TITLE -->
    <title id="index">Asker Chamber of Commerce</title>
    <!-- META -->
    <meta name="description" content="WDD 231 - Homapage for the Chamber of Commerce in Asker, Norway.">

    <!-- FACEBOOK META -->
    <meta property="og:locale" content="en_NO">
    <meta property="image" content="./images/chamber-logo.svg">
    <meta property="og:url" content="https://askercc.no">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Joseph Jameson-Rickard">

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet">

    <!-- CSS FILES -->
    <link rel="stylesheet" href="./styles/chamber.css">
    <link rel="stylesheet" href="./styles/chamber-large.css">

    <!-- SCRIPTS -->
    <script src="./scripts/chamber.js" defer></script>
    <script src="./scripts/weather.js" defer></script>
    <script src="./scripts/get-dates.js" defer></script>

  </head>

  <body>
    <header>
      <img src="./images/chamber-logo.svg" alt="Logo of the Asker Chamber of Commerce">
      <span>Asker Chamber of Commerce</span>
      <button id="navButton" class="hamburger" aria-label="navigation"></button>
      <nav class="navigation">
        <ul>
          <a href="./index.html"><li class="current">Home</li></a>
          <a href="./directory.html"><li>Directory</li></a>
          <a href="#"><li>Join</li></a>
          <a href="#"><li>Discover</li></a>
        </ul>
      </nav>
    </header>
    <main>
      <picture class="hero">
        <source srcset="./images/chamber-hero-large.webp" media="min-width: 1000px">
        <source srcset="./images/chamber-hero-medium.webp" media="min-width: 750px">
        <img src="./images/chamber-hero.webp" alt="" width="100%" height="50%">
      </picture>

      <a href="#" class="call-to-action"><button class="call-to-action">Call to Action</button></a>

      <!--********** CURRENT EVENTS  SECTION *********-->
      <section class="current-events"></section>

      <!--********** WEATHER SECTION *********-->
      <section class="weather-section">
        <figure>
          <p>Asker, Norway - <span id="currentTemp"></span></p>
          <img id="weather-icon" src="" alt="Icon depicting the current weather in Asker, Norway">
          <p id="weatherDay1"></p>
          <p id="weatherDay2"></p>
          <p id="weatherDay3"></p>
          <figcaption></figcaption>
        </figure>
      </section>

      <!--********** SPOTLIGHT SECTION *********-->
      <section class="spotlight-section"></section>

      <h1>Home</h1>
    </main>
    <footer>
      <div class="footer-left">
        <p>Asker Chamber of Commerce</p>
        <p>24 Torvveien</p>
        <p>Asker, 1383, Norge</p>
        <p>info@askercc.org</p>
        <p>(+47) 12 34 56 78</p>
      </div>
      <div class="footer-middle">
        <a href="https://www.youtube.com/">
          <img class="social-icon" src="./images/youtube-icon.svg"
            alt="Link to YouTube account of the Asker Chamber of Commerce">
        </a>
        <a href="https://x.com/">
          <img class="social-icon" src="./images/twitter-icon.svg"
            alt="Link to Twitter profile of the Asker Chamber of Commerce">
        </a>
        <a href="https://www.linkedin.com/">
          <img class="social-icon" src="./images/linkedin-icon.svg"
            alt="Link to LinkedIn profile of the Asker Chamber of Commerce">
        </a>
      </div>
      <div class="footer-right">
        <p>WDD231 Class Project</p>
        <p>Joseph Jameson-Rickard</p>
        <p>&copy;<span id="currentYear"></span> Asker Chamber of Commerce</p>
        <p id="lastModified"></p>
      </div>
    </footer>
