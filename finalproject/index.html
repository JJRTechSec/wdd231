<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--***************** TITLE *****************-->
    <title>The Marathon Guidebook</title>

    <!--***************** META *****************-->
    <meta name="description" content="Homepage for The Marathon Guidebook, the final project of this wdd231 course. Find key information on all the majors among others.">
    <meta name="author" content="Joseph Jameson-Rickard">

    <!--***************** FACEBOOK META *****************-->
    <meta property="og:title" content="WDD231 - The Marathon GuideBook Homepage">
    <meta property="og:description" content="Homepage for The Marathon Guidebook, the final project of this wdd231 course. Find key information on all the majors among others.">
    <meta property="og:locale" content="en_UK">
    <meta property="og:image" content="https://jjrtechsec.github.io/wdd231/finalproject/images/hero.webp">
    <meta property="og:url" content="https://jjrtechsec.github.io/wdd231/finalproject/index.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Joseph Jameson-Rickard">

    <!--***************** FAVICON *****************-->
    <link rel="icon" href="./images/logo-blue.svg" class="icon">

    <!--***************** FONTS *****************-->

    <!--***************** STYLES *****************-->
    <link rel="stylesheet" href="./styles/final.css">
    <link rel="stylesheet" href="./styles/final-medium.css">
    <link rel="stylesheet" href="./styles/final-large.css">

    <!--***************** SCRIPTS *****************-->
    <script src="./scripts/homepage.js" type="module"></script>
  </head>

  <body>
    <!--***************** HEADER *****************-->
    <header>
      <img src="./images/logo-black.svg" alt="The Marathon Guidebook Logo." class="header-logo">
      <span>The Marathon Guidebook</span>
      <button id="navButton" class="hamburger" aria-label="navigation"></button>
      <nav class="navigation">
        <ul>
          <li class="current"><a class="current" href="index.html">Home</a></li>
          <li><a href="entry-info.html">Entry Info</a></li>
          <li><a href="newsletter.html">Newsletter</a></li>
        </ul>
      </nav>
    </header>

    <!--***************** MAIN *****************-->
    <main class="main-home">
      <div class="hero-div">
        <picture class="hero">
          <source srcset="./images/hero.webp" media="(min-width: 1000px)">
          <source srcset="./images/hero-medium.webp" media="(min-width: 750px)">
          <img src="./images/hero-small.webp" alt="Image of marathon runners at the London Marathon start line." fetchpriority="high">
        </picture>
        <a class="button ctaBtn" href="./newsletter.html">Sign Up to our Newsletter</a>
      </div>

      <h1>The Marathon Guidebook</h1>
      <h2>Filter the marathons you wish to see:</h2>
      <div class="display-buttons">
        <button id="allRaces" class="currentRaceDisplay">All</button>
        <button id="majorRaces">Majors</button>
        <button id="destinationRaces">Experience</button>
      </div>

      <div id="raceDisplay" class="race-display"></div>
      <dialog id="modal" class="modal">
        <h3 id="modalTitle"></h3>
        <p id="whenMajor"></p>
        <p id="firstHeld"></p>
        <p id="totalParticipants"></p>
        <p id="currentWeather"></p>
        <button id="closeModal">Close</button>
      </dialog>
    </main>

    <!--***************** FOOTER *****************-->
    <footer>
      <!--***************** FOOTER LEFT *****************-->
      <div class="footer-left">
        <p>Navigation</p>
        <a href="./index.html">Home</a>
        <a href="./entry-info.html">Entry Info</a>
        <a href="./newsletter.html">Newsletter</a>
      </div>
      <!--***************** FOOTER MIDDLE *****************-->
      <div class="footer-middle">
        <p>&copy;<span id="currentYear"></span> Joseph Jameson-Rickard</p>
      </div>

      <!--***************** FOOTER RIGHT *****************-->
      <div class="footer-right">
        <p>External Links</p>
        <a href="./attributions.html">Attributions</a>
        <a href="https://www.loom.com/share/72105180fd784fd99c011f90992380e1">Video Link</a>
      </div>
    </footer>
  </body>
</html>
